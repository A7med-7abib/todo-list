<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Medical Delivery Route Tracker - Track your daily deliveries, doctors, and routes efficiently"
    />
    <title>view tec todo list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="./viewtec-logo-BG9fGoOa.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background animated elements -->
    <div class="bg-decoration">
      <div class="bg-circle bg-circle-1"></div>
      <div class="bg-circle bg-circle-2"></div>
      <div class="bg-circle bg-circle-3"></div>
    </div>

    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-logo">
          <img
            src="./viewtec-logo-BG9fGoOa.png"
            alt="VIEW TEC Logo"
            id="logoImg"
          />
        </div>
        <h1 id="appTitle">view tec company</h1>
      </header>

      <!-- Add New Entry Form -->
      <div class="form-card" id="formCard">
        <div class="form-header" onclick="toggleForm()">
          <h2 id="formTitle">New Delivery</h2>
          <span class="form-toggle" id="formToggleIcon">▼</span>
        </div>
        <div class="form-body" id="formBody">
          <div class="form-grid">
            <div class="form-group">
              <label for="deliveryDate">Date</label>
              <input type="date" id="deliveryDate" required />
            </div>
            <div class="form-group">
              <label for="doctorName">Doctor Name</label>
              <input
                type="text"
                id="doctorName"
                placeholder="Dr. Ahmed..."
                required
              />
            </div>
            <div class="form-group">
              <label for="engineerName">Engineer Name</label>
              <input
                type="text"
                id="engineerName"
                placeholder="Eng. Mohamed..."
              />
            </div>
            <div class="form-group">
              <label for="deliveryDays">Day</label>
              <input
                type="text"
                id="deliveryDays"
                list="daysList"
                placeholder="e.g. Saturday..."
              />
              <datalist id="daysList">
                <option value="Saturday"></option>
                <option value="Sunday"></option>
                <option value="Monday"></option>
                <option value="Tuesday"></option>
                <option value="Wednesday"></option>
                <option value="Thursday"></option>
                <option value="Friday"></option>
              </datalist>
            </div>
            <div class="form-group">
              <label for="deliveryCost">Cost</label>
              <input
                type="number"
                id="deliveryCost"
                min="0"
                step="0.01"
                value="0"
                placeholder="0.00"
                readonly
              />
            </div>
          </div>

          <!-- Route Stops -->
          <div class="route-section">
            <label>Route Stops</label>
            <div class="stops-container" id="stopsContainer">
              <div class="stop-item" data-stop="1">
                <div class="stop-marker start">
                  <span>1</span>
                </div>
                <input
                  type="text"
                  class="stop-input stop-name"
                  placeholder="Starting point..."
                  required
                />
                <button
                  class="btn-remove-stop"
                  onclick="removeStop(this)"
                  title="Remove"
                  style="display: none"
                >
                  ✕
                </button>
              </div>
              <div class="route-segment">
                <div class="segment-line"></div>
                <div class="segment-cost">
                  <span class="segment-cost-icon"
                    ><i class="bi bi-cash-coin"></i
                  ></span>
                  <input
                    type="number"
                    class="segment-cost-input"
                    placeholder="Cost to next stop..."
                    min="0"
                    step="0.01"
                    oninput="calculateTotalCost()"
                  />
                </div>
              </div>
              <div class="stop-item" data-stop="2">
                <div class="stop-marker end">
                  <span>2</span>
                </div>
                <input
                  type="text"
                  class="stop-input stop-name"
                  placeholder="Final destination..."
                  required
                />
                <button
                  class="btn-remove-stop"
                  onclick="removeStop(this)"
                  title="Remove"
                  style="display: none"
                >
                  ✕
                </button>
              </div>
            </div>
            <button
              class="btn-add-stop"
              id="btnAddStop"
              onclick="addStop()"
            >
              + Add Stop
            </button>
          </div>

          <!-- Notes -->
          <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea
              id="notes"
              rows="2"
              placeholder="Any extra details..."
            ></textarea>
          </div>

          <!-- Status -->
          <div class="form-group">
            <label>Status</label>
            <div class="status-options">
              <label class="status-radio">
                <input type="radio" name="status" value="pending" checked />
                <span class="status-badge pending">Pending</span>
              </label>
              <label class="status-radio">
                <input type="radio" name="status" value="in-progress" />
                <span class="status-badge in-progress">In Progress</span>
              </label>
              <label class="status-radio">
                <input type="radio" name="status" value="completed" />
                <span class="status-badge completed">Completed</span>
              </label>
            </div>
          </div>

          <button
            class="btn-submit"
            id="btnSubmit"
            onclick="saveDelivery()"
          >
            Save Delivery
          </button>
        </div>
      </div>

      <!-- Filter/Search -->
      <div class="filter-bar">
        <div class="search-box">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search doctor or destination..."
            oninput="filterDeliveries()"
          />
        </div>
        <div class="filter-chips">
          <button
            class="chip active"
            onclick="filterByStatus('all', this)"
          >
            All
          </button>
          <button
            class="chip"
            onclick="filterByStatus('pending', this)"
          >
            Pending
          </button>
          <button
            class="chip"
            onclick="filterByStatus('in-progress', this)"
          >
            In Progress
          </button>
          <button
            class="chip"
            onclick="filterByStatus('completed', this)"
          >
            Completed
          </button>
        </div>
      </div>

      <!-- Deliveries List -->
      <div class="deliveries-list" id="deliveriesList">
        <!-- Cards will be rendered here -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"></div>
        <h3>No deliveries yet</h3>
        <p>Add your first delivery above to get started!</p>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Edit Delivery</h2>
          <button class="modal-close" onclick="closeEditModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Will be populated dynamically -->
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
  </body>
</html>
